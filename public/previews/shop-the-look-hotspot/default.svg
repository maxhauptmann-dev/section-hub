<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <defs><filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="8" flood-color="#00000020"/></filter></defs>
  <rect width="800" height="520" fill="#f5f5f5"/>
  <text x="30" y="36" font-family="system-ui" font-size="22" font-weight="700" fill="#1a1a1a">Shop the look</text>
  <!-- Lifestyle image -->
  <rect x="50" y="60" width="700" height="420" rx="12" fill="#c9bfaa"/>
  <!-- Scene details -->
  <rect x="50" y="60" width="700" height="420" rx="12" fill="#bfb5a0"/>
  <rect x="250" y="60" width="300" height="420" rx="0" fill="#b5a890" opacity="0.6"/>
  <!-- Model silhouette -->
  <ellipse cx="400" cy="200" rx="50" ry="65" fill="#a89880"/>
  <path d="M352 260 Q340 320 348 480 L452 480 Q460 320 448 260Z" fill="#988870" opacity="0.85"/>
  <!-- Hotspot dots -->
  <circle cx="340" cy="240" r="10" fill="white" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
  <circle cx="340" cy="240" r="16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="450" cy="350" r="10" fill="white" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
  <circle cx="450" cy="350" r="16" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" opacity="0.6"/>
  <!-- Popup card (appears on click) -->
  <rect x="480" y="140" width="200" height="220" rx="12" fill="white" filter="url(#sh)"/>
  <!-- popup close btn -->
  <circle cx="665" cy="155" r="10" fill="#f0f0f0"/>
  <text x="665" y="159" text-anchor="middle" font-family="system-ui" font-size="10" fill="#666">✕</text>
  <!-- popup product image -->
  <rect x="492" y="156" width="176" height="100" rx="6" fill="#e0d6c8"/>
  <rect x="530" y="175" width="100" height="60" rx="3" fill="#c4a882"/>
  <!-- popup info -->
  <text x="492" y="276" font-family="system-ui" font-size="12" font-weight="600" fill="#1a1a1a">Cardigan</text>
  <text x="492" y="294" font-family="system-ui" font-size="12" fill="#1a1a1a" font-weight="600">$108.00</text>
  <!-- More Details button -->
  <rect x="492" y="306" width="90" height="26" rx="4" fill="#1a1a1a"/>
  <text x="537" y="323" text-anchor="middle" font-family="system-ui" font-size="10" fill="white" font-weight="500">More Details</text>
  <!-- Second popup hint (faded) -->
  <rect x="160" y="280" width="160" height="60" rx="10" fill="white" filter="url(#sh)" opacity="0.5"/>
  <text x="240" y="308" text-anchor="middle" font-family="system-ui" font-size="11" font-weight="600" fill="#1a1a1a" opacity="0.5">Whitney Pullover</text>
  <text x="240" y="324" text-anchor="middle" font-family="system-ui" font-size="11" fill="#555" opacity="0.5">$138.00</text>
</svg>
