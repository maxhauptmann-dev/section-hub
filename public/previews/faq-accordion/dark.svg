<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#0f0f0f"/>
  
  <!-- Header -->
  <text x="300" y="50" text-anchor="middle" font-family="system-ui" font-size="24" fill="white" font-weight="700">Frequently Asked Questions</text>
  
  <!-- FAQ Items -->
  <g transform="translate(60, 80)">
    <!-- Item 1 - Open -->
    <rect x="0" y="0" width="480" height="90" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui" font-size="14" fill="white" font-weight="600">How do I install sections?</text>
    <text x="460" y="30" font-family="system-ui" font-size="18" fill="#8b5cf6">−</text>
    <text x="20" y="55" font-family="system-ui" font-size="12" fill="#888">Simply click the Install button and the section will be</text>
    <text x="20" y="72" font-family="system-ui" font-size="12" fill="#888">automatically added to your theme.</text>
    
    <!-- Item 2 - Closed -->
    <rect x="0" y="100" width="480" height="44" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="20" y="128" font-family="system-ui" font-size="14" fill="white" font-weight="600">Are updates included?</text>
    <text x="460" y="128" font-family="system-ui" font-size="18" fill="#555">+</text>
    
    <!-- Item 3 - Closed -->
    <rect x="0" y="154" width="480" height="44" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="20" y="182" font-family="system-ui" font-size="14" fill="white" font-weight="600">Do sections work with my theme?</text>
    <text x="460" y="182" font-family="system-ui" font-size="18" fill="#555">+</text>
    
    <!-- Item 4 - Closed -->
    <rect x="0" y="208" width="480" height="44" rx="8" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <text x="20" y="236" font-family="system-ui" font-size="14" fill="white" font-weight="600">Can I customize the sections?</text>
    <text x="460" y="236" font-family="system-ui" font-size="18" fill="#555">+</text>
  </g>
</svg>