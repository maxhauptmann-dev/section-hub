<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <!-- Background -->
  <rect width="600" height="350" fill="#0a0a0a"/>
  
  <!-- Main Card -->
  <rect x="100" y="50" width="400" height="220" rx="16" fill="#1a1a1a"/>
  
  <!-- Avatar -->
  <circle cx="300" cy="100" r="35" fill="#333"/>
  
  <!-- Stars -->
  <text x="300" y="155" text-anchor="middle" font-family="system-ui" font-size="16" fill="#fbbf24">★★★★★</text>
  
  <!-- Quote -->
  <text x="300" y="185" text-anchor="middle" font-family="system-ui" font-size="14" fill="#888">"This product completely changed my routine.</text>
  <text x="300" y="205" text-anchor="middle" font-family="system-ui" font-size="14" fill="#888">I can't imagine going back!"</text>
  
  <!-- Name -->
  <text x="300" y="240" text-anchor="middle" font-family="system-ui" font-size="14" fill="white" font-weight="600">Jennifer K.</text>
  
  <!-- Navigation Arrows -->
  <circle cx="60" cy="160" r="20" fill="#1a1a1a"/>
  <path d="M65 160L55 155V165Z" fill="#666"/>
  <circle cx="540" cy="160" r="20" fill="#1a1a1a"/>
  <path d="M535 160L545 155V165Z" fill="#666"/>
  
  <!-- Dots -->
  <circle cx="270" cy="300" r="4" fill="#8b5cf6"/>
  <circle cx="290" cy="300" r="4" fill="#333"/>
  <circle cx="310" cy="300" r="4" fill="#333"/>
  <circle cx="330" cy="300" r="4" fill="#333"/>
</svg>