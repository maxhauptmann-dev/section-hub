<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <!-- Background with brand color top bar -->
  <rect width="600" height="350" fill="#fff"/>
  <rect width="600" height="8" fill="#f59e0b"/>
  
  <!-- Main Card -->
  <rect x="100" y="58" width="400" height="220" rx="16" fill="#fffbeb" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.08))"/>
  
  <!-- Avatar -->
  <circle cx="300" cy="108" r="35" fill="#fde68a"/>
  
  <!-- Stars -->
  <text x="300" y="163" text-anchor="middle" font-family="system-ui" font-size="16" fill="#f59e0b">★★★★★</text>
  
  <!-- Quote -->
  <text x="300" y="193" text-anchor="middle" font-family="system-ui" font-size="14" fill="#666">"This product completely changed my routine.</text>
  <text x="300" y="213" text-anchor="middle" font-family="system-ui" font-size="14" fill="#666">I can't imagine going back!"</text>
  
  <!-- Name -->
  <text x="300" y="248" text-anchor="middle" font-family="system-ui" font-size="14" fill="#1a1a1a" font-weight="600">Jennifer K.</text>
  
  <!-- Navigation Arrows -->
  <circle cx="60" cy="168" r="20" fill="#fef3c7"/>
  <path d="M65 168L55 163V173Z" fill="#f59e0b"/>
  <circle cx="540" cy="168" r="20" fill="#fef3c7"/>
  <path d="M535 168L545 163V173Z" fill="#f59e0b"/>
  
  <!-- Dots -->
  <circle cx="270" cy="308" r="4" fill="#f59e0b"/>
  <circle cx="290" cy="308" r="4" fill="#fde68a"/>
  <circle cx="310" cy="308" r="4" fill="#fde68a"/>
  <circle cx="330" cy="308" r="4" fill="#fde68a"/>
</svg>