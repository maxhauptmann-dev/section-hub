<svg xmlns="http://www.w3.org/2000/svg" width="600" height="350" viewBox="0 0 600 350">
  <!-- Background -->
  <rect width="600" height="350" fill="#fff"/>
  
  <!-- Main Card -->
  <rect x="100" y="50" width="400" height="220" rx="16" fill="#f9fafb" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.08))"/>
  
  <!-- Avatar -->
  <circle cx="300" cy="100" r="35" fill="#e5e5e5"/>
  
  <!-- Stars -->
  <text x="300" y="155" text-anchor="middle" font-family="system-ui" font-size="16" fill="#fbbf24">★★★★★</text>
  
  <!-- Quote -->
  <text x="300" y="185" text-anchor="middle" font-family="system-ui" font-size="14" fill="#666">"This product completely changed my routine.</text>
  <text x="300" y="205" text-anchor="middle" font-family="system-ui" font-size="14" fill="#666">I can't imagine going back!"</text>
  
  <!-- Name -->
  <text x="300" y="240" text-anchor="middle" font-family="system-ui" font-size="14" fill="#1a1a1a" font-weight="600">Jennifer K.</text>
  
  <!-- Navigation Arrows -->
  <circle cx="60" cy="160" r="20" fill="#f3f4f6"/>
  <path d="M65 160L55 155V165Z" fill="#666"/>
  <circle cx="540" cy="160" r="20" fill="#f3f4f6"/>
  <path d="M535 160L545 155V165Z" fill="#666"/>
  
  <!-- Dots -->
  <circle cx="270" cy="300" r="4" fill="#6366f1"/>
  <circle cx="290" cy="300" r="4" fill="#d1d5db"/>
  <circle cx="310" cy="300" r="4" fill="#d1d5db"/>
  <circle cx="330" cy="300" r="4" fill="#d1d5db"/>
</svg>