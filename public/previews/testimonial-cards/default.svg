<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with brand color top bar -->
  <rect width="600" height="400" fill="#f0fdf4"/>
  <rect width="600" height="8" fill="#00b67a"/>
  
  <!-- Header -->
  <text x="300" y="53" text-anchor="middle" font-family="system-ui" font-size="22" fill="#1a1a1a" font-weight="700">What Our Customers Say</text>
  
  <!-- Cards -->
  <g transform="translate(30, 78)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="170" height="200" rx="12" fill="white" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <text x="15" y="30" font-family="system-ui" font-size="12" fill="#00b67a">★★★★★</text>
    <text x="15" y="55" font-family="system-ui" font-size="11" fill="#666">"Amazing product!</text>
    <text x="15" y="70" font-family="system-ui" font-size="11" fill="#666">Exceeded all my</text>
    <text x="15" y="85" font-family="system-ui" font-size="11" fill="#666">expectations."</text>
    <circle cx="35" cy="170" r="18" fill="#bbf7d0"/>
    <text x="60" y="168" font-family="system-ui" font-size="12" fill="#1a1a1a" font-weight="600">Sarah M.</text>
    <text x="60" y="183" font-family="system-ui" font-size="10" fill="#888">Verified Buyer</text>
    
    <!-- Card 2 -->
    <rect x="185" y="0" width="170" height="200" rx="12" fill="white" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <text x="200" y="30" font-family="system-ui" font-size="12" fill="#00b67a">★★★★★</text>
    <text x="200" y="55" font-family="system-ui" font-size="11" fill="#666">"Best purchase I've</text>
    <text x="200" y="70" font-family="system-ui" font-size="11" fill="#666">made this year.</text>
    <text x="200" y="85" font-family="system-ui" font-size="11" fill="#666">Highly recommend!"</text>
    <circle cx="220" cy="170" r="18" fill="#bbf7d0"/>
    <text x="245" y="168" font-family="system-ui" font-size="12" fill="#1a1a1a" font-weight="600">Mike R.</text>
    <text x="245" y="183" font-family="system-ui" font-size="10" fill="#888">Verified Buyer</text>
    
    <!-- Card 3 -->
    <rect x="370" y="0" width="170" height="200" rx="12" fill="white" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.06))"/>
    <text x="385" y="30" font-family="system-ui" font-size="12" fill="#00b67a">★★★★★</text>
    <text x="385" y="55" font-family="system-ui" font-size="11" fill="#666">"Fast shipping and</text>
    <text x="385" y="70" font-family="system-ui" font-size="11" fill="#666">great quality.</text>
    <text x="385" y="85" font-family="system-ui" font-size="11" fill="#666">Will buy again!"</text>
    <circle cx="405" cy="170" r="18" fill="#bbf7d0"/>
    <text x="430" y="168" font-family="system-ui" font-size="12" fill="#1a1a1a" font-weight="600">Emma L.</text>
    <text x="430" y="183" font-family="system-ui" font-size="10" fill="#888">Verified Buyer</text>
  </g>
</svg>