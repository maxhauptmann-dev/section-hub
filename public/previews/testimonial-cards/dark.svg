<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#0a0a0a"/>
  
  <!-- Header -->
  <text x="300" y="45" text-anchor="middle" font-family="system-ui" font-size="22" fill="white" font-weight="700">What Our Customers Say</text>
  
  <!-- Cards -->
  <g transform="translate(30, 70)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="170" height="200" rx="12" fill="#1a1a1a"/>
    <text x="15" y="30" font-family="system-ui" font-size="12" fill="#fbbf24">★★★★★</text>
    <text x="15" y="55" font-family="system-ui" font-size="11" fill="#888">"Amazing product!</text>
    <text x="15" y="70" font-family="system-ui" font-size="11" fill="#888">Exceeded all my</text>
    <text x="15" y="85" font-family="system-ui" font-size="11" fill="#888">expectations."</text>
    <circle cx="35" cy="170" r="18" fill="#333"/>
    <text x="60" y="168" font-family="system-ui" font-size="12" fill="white" font-weight="600">Sarah M.</text>
    <text x="60" y="183" font-family="system-ui" font-size="10" fill="#666">Verified Buyer</text>
    
    <!-- Card 2 -->
    <rect x="185" y="0" width="170" height="200" rx="12" fill="#1a1a1a"/>
    <text x="200" y="30" font-family="system-ui" font-size="12" fill="#fbbf24">★★★★★</text>
    <text x="200" y="55" font-family="system-ui" font-size="11" fill="#888">"Best purchase I've</text>
    <text x="200" y="70" font-family="system-ui" font-size="11" fill="#888">made this year.</text>
    <text x="200" y="85" font-family="system-ui" font-size="11" fill="#888">Highly recommend!"</text>
    <circle cx="220" cy="170" r="18" fill="#333"/>
    <text x="245" y="168" font-family="system-ui" font-size="12" fill="white" font-weight="600">Mike R.</text>
    <text x="245" y="183" font-family="system-ui" font-size="10" fill="#666">Verified Buyer</text>
    
    <!-- Card 3 -->
    <rect x="370" y="0" width="170" height="200" rx="12" fill="#1a1a1a"/>
    <text x="385" y="30" font-family="system-ui" font-size="12" fill="#fbbf24">★★★★★</text>
    <text x="385" y="55" font-family="system-ui" font-size="11" fill="#888">"Fast shipping and</text>
    <text x="385" y="70" font-family="system-ui" font-size="11" fill="#888">great quality.</text>
    <text x="385" y="85" font-family="system-ui" font-size="11" fill="#888">Will buy again!"</text>
    <circle cx="405" cy="170" r="18" fill="#333"/>
    <text x="430" y="168" font-family="system-ui" font-size="12" fill="white" font-weight="600">Emma L.</text>
    <text x="430" y="183" font-family="system-ui" font-size="10" fill="#666">Verified Buyer</text>
  </g>
</svg>