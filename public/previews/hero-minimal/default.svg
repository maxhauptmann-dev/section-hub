  <!-- Left Content -->
  <g transform="translate(40, 100)">
    <text x="0" y="0" font-family="system-ui" font-size="36" fill="#1a1a1a" font-weight="700">Premium</text>
    <text x="0" y="44" font-family="system-ui" font-size="36" fill="#1a1a1a" font-weight="700">Quality</text>
