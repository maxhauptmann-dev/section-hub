<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background with brand color top bar -->
  <rect width="600" height="400" fill="#fafafa"/>
  <rect width="600" height="8" fill="#6366f1"/>
  
  <!-- Left Content -->
  <g transform="translate(40, 108)">
    <text x="0" y="0" font-family="system-ui" font-size="36" fill="#1a1a1a" font-weight="700">Premium</text>
    <text x="0" y="44" font-family="system-ui" font-size="36" fill="#1a1a1a" font-weight="700">Quality</text>
    <text x="0" y="90" font-family="system-ui" font-size="14" fill="#666">Discover our collection of</text>
    <text x="0" y="110" font-family="system-ui" font-size="14" fill="#666">handcrafted products.</text>
    
    <!-- Button -->
    <rect x="0" y="140" width="130" height="42" rx="6" fill="#6366f1"/>
    <text x="65" y="166" text-anchor="middle" font-family="system-ui" font-size="13" fill="white" font-weight="500">Shop Now</text>
  </g>
  
  <!-- Right Image Placeholder -->
  <rect x="320" y="68" width="240" height="280" rx="12" fill="#e5e7eb"/>
  <rect x="360" y="168" width="160" height="80" rx="8" fill="#d1d5db"/>
</svg>