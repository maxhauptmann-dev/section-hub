    <circle cx="85" cy="65" r="24" fill="rgba(255,255,255,0.2)"/>
    <polygon points="80,55 80,75 95,65" fill="white"/>
    <text x="20" y="155" font-family="system-ui" font-size="10" fill="#fbbf24">★★★★★</text>
    <text x="20" y="175" font-family="system-ui" font-size="11" fill="#fff" font-weight="500">Sarah M.</text>
    <text x="20" y="190" font-family="system-ui" font-size="9" fill="#888">"Amazing results!"</text>
    
    <!-- Card 2 -->
    <rect x="185" y="0" width="170" height="200" rx="12" fill="#2a2a2a"/>
    <rect x="185" y="0" width="170" height="130" rx="12" fill="#333"/>
    <circle cx="270" cy="65" r="24" fill="rgba(255,255,255,0.2)"/>
    <polygon points="265,55 265,75 280,65" fill="white"/>
    <text x="205" y="155" font-family="system-ui" font-size="10" fill="#fbbf24">★★★★★</text>
    <text x="205" y="175" font-family="system-ui" font-size="11" fill="#fff" font-weight="500">Mike R.</text>
    <text x="205" y="190" font-family="system-ui" font-size="9" fill="#888">"Life changing!"</text>
    
