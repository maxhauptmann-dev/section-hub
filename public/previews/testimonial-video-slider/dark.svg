    <polygon points="450,55 450,75 465,65" fill="white"/>
    <text x="390" y="155" font-family="system-ui" font-size="10" fill="#fbbf24">★★★★★</text>
    <text x="390" y="175" font-family="system-ui" font-size="11" fill="#fff" font-weight="500">Emma L.</text>
    <text x="390" y="190" font-family="system-ui" font-size="9" fill="#888">"Highly recommend!"</text>
