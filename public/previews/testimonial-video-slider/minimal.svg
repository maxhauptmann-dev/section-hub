<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Header -->
  <text x="300" y="60" text-anchor="middle" font-family="system-ui" font-size="24" fill="#1a1a1a" font-weight="600">What our customers say</text>
  
  <!-- Video Cards - Minimal Style -->
  <g transform="translate(30, 120)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="170" height="240" rx="8" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="10" y="10" width="150" height="140" rx="6" fill="#f0f0f0"/>
    <circle cx="85" cy="80" r="20" fill="rgba(0,0,0,0.1)"/>
    <polygon points="80,70 80,90 95,80" fill="#666"/>
    <rect x="10" y="165" width="60" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="10" y="185" width="100" height="10" rx="5" fill="#f0f0f0"/>
    <rect x="10" y="205" width="140" height="8" rx="4" fill="#f5f5f5"/>
    <rect x="10" y="220" width="80" height="8" rx="4" fill="#f5f5f5"/>
    
    <!-- Card 2 -->
    <rect x="185" y="0" width="170" height="240" rx="8" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="195" y="10" width="150" height="140" rx="6" fill="#f0f0f0"/>
    <circle cx="270" cy="80" r="20" fill="rgba(0,0,0,0.1)"/>
    <polygon points="265,70 265,90 280,80" fill="#666"/>
    <rect x="195" y="165" width="60" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="195" y="185" width="100" height="10" rx="5" fill="#f0f0f0"/>
    <rect x="195" y="205" width="140" height="8" rx="4" fill="#f5f5f5"/>
    <rect x="195" y="220" width="80" height="8" rx="4" fill="#f5f5f5"/>
    
    <!-- Card 3 -->
    <rect x="370" y="0" width="170" height="240" rx="8" fill="#fafafa" stroke="#e5e5e5" stroke-width="1"/>
    <rect x="380" y="10" width="150" height="140" rx="6" fill="#f0f0f0"/>
    <circle cx="455" cy="80" r="20" fill="rgba(0,0,0,0.1)"/>
    <polygon points="450,70 450,90 465,80" fill="#666"/>
    <rect x="380" y="165" width="60" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="380" y="185" width="100" height="10" rx="5" fill="#f0f0f0"/>
    <rect x="380" y="205" width="140" height="8" rx="4" fill="#f5f5f5"/>
    <rect x="380" y="220" width="80" height="8" rx="4" fill="#f5f5f5"/>
  </g>
  
  <!-- Navigation Arrows -->
  <circle cx="20" cy="240" r="16" fill="#f0f0f0"/>
  <path d="M24 240L18 235V245Z" fill="#999"/>
  <circle cx="580" cy="240" r="16" fill="#f0f0f0"/>
  <path d="M576 240L582 235V245Z" fill="#999"/>
