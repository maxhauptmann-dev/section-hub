<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <!-- Background photo simulation -->
  <rect width="800" height="520" fill="#3a2e24"/>
  <!-- Brick wall texture hint -->
  <rect x="0" y="0" width="800" height="520" fill="url(#bricks)" opacity="0.3"/>
  <defs>
    <pattern id="bricks" x="0" y="0" width="80" height="30" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="78" height="13" rx="1" fill="#6b4c3b" opacity="0.4"/>
      <rect x="40" y="16" width="78" height="13" rx="1" fill="#6b4c3b" opacity="0.4"/>
    </pattern>
  </defs>
  <!-- Dark overlay -->
  <rect width="800" height="520" fill="rgba(0,0,0,0.25)"/>
  <!-- Person silhouette -->
  <ellipse cx="420" cy="140" rx="42" ry="55" fill="#c8a882"/>
  <rect x="360" y="188" width="120" height="180" rx="8" fill="#4a6fa5" opacity="0.9"/>
  <rect x="370" y="368" width="45" height="120" rx="4" fill="#1a1a1a"/>
  <rect x="405" y="368" width="45" height="120" rx="4" fill="#1a1a1a"/>

  <!-- Label 1: DENIM JACKET -->
  <!-- dot -->
  <circle cx="200" cy="220" r="6" fill="white" opacity="0.9"/>
  <!-- card pill -->
  <rect x="216" y="200" width="190" height="42" rx="21" fill="rgba(255,255,255,0.88)"/>
  <!-- product image circle -->
  <circle cx="237" cy="221" r="15" fill="#4a6fa5"/>
  <rect x="228" y="213" width="18" height="16" rx="2" fill="#3a5a8a"/>
  <!-- text -->
  <text x="258" y="215" font-family="system-ui" font-size="9" fill="#888" letter-spacing="1">DENIM JACKET</text>
  <text x="258" y="228" font-family="system-ui" font-size="11" font-weight="600" fill="#1a1a1a">"Urban Explorer"</text>

  <!-- Label 2: STRIPED SHIRT -->
  <circle cx="200" cy="295" r="6" fill="white" opacity="0.9"/>
  <rect x="216" y="275" width="190" height="42" rx="21" fill="rgba(255,255,255,0.88)"/>
  <circle cx="237" cy="296" r="15" fill="#c4a86e"/>
  <rect x="229" y="289" width="16" height="14" rx="1" fill="#8b7340"/>
  <text x="258" y="290" font-family="system-ui" font-size="9" fill="#888" letter-spacing="1">STRIPED SHIRT</text>
  <text x="258" y="303" font-family="system-ui" font-size="11" font-weight="600" fill="#1a1a1a">"Classic Comfort</text>

  <!-- Label 3: CARGO PANTS -->
  <circle cx="200" cy="370" r="6" fill="white" opacity="0.9"/>
  <rect x="216" y="350" width="190" height="42" rx="21" fill="rgba(255,255,255,0.88)"/>
  <circle cx="237" cy="371" r="15" fill="#2d2d2d"/>
  <rect x="229" y="364" width="16" height="14" rx="1" fill="#1a1a1a"/>
  <text x="258" y="365" font-family="system-ui" font-size="9" fill="#888" letter-spacing="1">CARGO PANTS</text>
  <text x="258" y="378" font-family="system-ui" font-size="11" font-weight="600" fill="#1a1a1a">"Utility Trousers</text>

  <!-- Label 4: SNEAKERS -->
  <circle cx="200" cy="440" r="6" fill="white" opacity="0.9"/>
  <rect x="216" y="420" width="180" height="42" rx="21" fill="rgba(255,255,255,0.88)"/>
  <circle cx="237" cy="441" r="15" fill="#b5813e"/>
  <text x="258" y="435" font-family="system-ui" font-size="9" fill="#888" letter-spacing="1">SNEAKERS</text>
  <text x="258" y="448" font-family="system-ui" font-size="11" font-weight="600" fill="#1a1a1a">Retro Kicks</text>

  <!-- Star decoration -->
  <text x="740" y="490" font-family="system-ui" font-size="20" fill="rgba(255,255,255,0.5)">✦</text>
</svg>
