<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- Dark background -->
  <rect width="800" height="600" fill="#1a1510"/>

  <!-- Full-width lifestyle image (dark mood) -->
  <rect x="0" y="0" width="800" height="600" fill="#2a2318"/>
  <!-- Subtle figure silhouette -->
  <ellipse cx="420" cy="155" rx="52" ry="68" fill="#362c20"/>
  <path d="M368 220 Q355 350 362 600 L478 600 Q485 350 472 220Z" fill="#2d2418"/>
  <!-- Dark image overlay gradient -->
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#dg)"/>

  <!-- Hero text overlay (top-left) -->
  <text x="52" y="80" font-family="Georgia, serif" font-size="38" font-weight="700" fill="#fff" letter-spacing="-0.5">Shop the Look</text>
  <text x="52" y="108" font-family="system-ui" font-size="16" fill="rgba(255,255,255,0.65)">Complete the outfit</text>

  <!-- Label cards (right side, dark glass style) -->
  <!-- Label 1 -->
  <rect x="520" y="90" width="240" height="62" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Product image placeholder -->
  <rect x="530" y="98" width="44" height="44" rx="6" fill="#3d3020"/>
  <rect x="542" y="112" width="20" height="18" rx="2" fill="#5a4530"/>
  <!-- connector dot -->
  <circle cx="516" cy="121" r="5" fill="rgba(255,255,255,0.9)"/>
  <circle cx="516" cy="121" r="9" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="584" y="118" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5" font-weight="600">DENIM JACKET</text>
  <text x="584" y="133" font-family="Georgia, serif" font-size="13" fill="#fff" font-weight="600">"Urban Explorer"</text>
  <text x="584" y="147" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.7)">$89.00</text>

  <!-- Label 2 -->
  <rect x="520" y="175" width="240" height="62" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="530" y="183" width="44" height="44" rx="6" fill="#3d3020"/>
  <rect x="540" y="197" width="24" height="16" rx="2" fill="#6b5535"/>
  <circle cx="516" cy="206" r="5" fill="rgba(255,255,255,0.9)"/>
  <circle cx="516" cy="206" r="9" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="584" y="203" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5" font-weight="600">STRIPED SHIRT</text>
  <text x="584" y="218" font-family="Georgia, serif" font-size="13" fill="#fff" font-weight="600">"Classic Comfort"</text>
  <text x="584" y="232" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.7)">$44.00</text>

  <!-- Label 3 -->
  <rect x="520" y="265" width="240" height="62" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="530" y="273" width="44" height="44" rx="6" fill="#252525"/>
  <rect x="536" y="285" width="30" height="20" rx="2" fill="#333"/>
  <circle cx="516" cy="296" r="5" fill="rgba(255,255,255,0.9)"/>
  <circle cx="516" cy="296" r="9" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="584" y="293" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5" font-weight="600">CARGO PANTS</text>
  <text x="584" y="308" font-family="Georgia, serif" font-size="13" fill="#fff" font-weight="600">"Utility Trousers"</text>
  <text x="584" y="322" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.7)">$62.00</text>

  <!-- Label 4 -->
  <rect x="520" y="355" width="240" height="62" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="530" y="363" width="44" height="44" rx="6" fill="#3a3010"/>
  <ellipse cx="552" cy="385" rx="14" ry="10" fill="#6b5820"/>
  <circle cx="516" cy="386" r="5" fill="rgba(255,255,255,0.9)"/>
  <circle cx="516" cy="386" r="9" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="584" y="383" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5" font-weight="600">SNEAKERS</text>
  <text x="584" y="398" font-family="Georgia, serif" font-size="13" fill="#fff" font-weight="600">"Retro Kicks"</text>
  <text x="584" y="412" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.7)">$128.00</text>

  <!-- Label 5 -->
  <rect x="520" y="445" width="240" height="62" rx="10" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="530" y="453" width="44" height="44" rx="6" fill="#2a2010"/>
  <ellipse cx="552" cy="470" rx="12" ry="8" fill="#4a3818"/>
  <ellipse cx="552" cy="478" rx="8" ry="5" fill="#3a2c12"/>
  <circle cx="516" cy="476" r="5" fill="rgba(255,255,255,0.9)"/>
  <circle cx="516" cy="476" r="9" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="584" y="473" font-family="system-ui" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1.5" font-weight="600">ACCESSORIES</text>
  <text x="584" y="488" font-family="Georgia, serif" font-size="13" fill="#fff" font-weight="600">"Accessory Duo"</text>
  <text x="584" y="502" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.7)">$36.00</text>

  <!-- Decorative sparkle (bottom right) -->
  <g transform="translate(755,555)">
    <path d="M0,-10 L2,-2 L10,0 L2,2 L0,10 L-2,2 L-10,0 L-2,-2 Z" fill="rgba(255,255,255,0.4)"/>
  </g>
