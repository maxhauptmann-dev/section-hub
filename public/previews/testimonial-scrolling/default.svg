<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <!-- Background with brand color top bar -->
  <rect width="600" height="300" fill="#fdf2f8"/>
  <rect width="600" height="8" fill="#ec4899"/>
  
  <!-- Header -->
  <text x="300" y="48" text-anchor="middle" font-family="system-ui" font-size="18" fill="#1a1a1a" font-weight="700">Loved by Thousands</text>
  
  <!-- Scrolling Row -->
  <g transform="translate(0, 78)">
    <!-- Card 1 -->
    <rect x="20" y="0" width="160" height="100" rx="10" fill="white" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="35" y="25" font-family="system-ui" font-size="10" fill="#ec4899">★★★★★</text>
    <text x="35" y="45" font-family="system-ui" font-size="9" fill="#666">"Amazing!"</text>
    <text x="35" y="75" font-family="system-ui" font-size="10" fill="#1a1a1a" font-weight="500">Sarah M.</text>
    
    <!-- Card 2 -->
    <rect x="195" y="0" width="160" height="100" rx="10" fill="white" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="210" y="25" font-family="system-ui" font-size="10" fill="#ec4899">★★★★★</text>
    <text x="210" y="45" font-family="system-ui" font-size="9" fill="#666">"Love it!"</text>
    <text x="210" y="75" font-family="system-ui" font-size="10" fill="#1a1a1a" font-weight="500">Mike R.</text>
    
    <!-- Card 3 -->
    <rect x="370" y="0" width="160" height="100" rx="10" fill="white" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="385" y="25" font-family="system-ui" font-size="10" fill="#ec4899">★★★★★</text>
    <text x="385" y="45" font-family="system-ui" font-size="9" fill="#666">"Perfect!"</text>
    <text x="385" y="75" font-family="system-ui" font-size="10" fill="#1a1a1a" font-weight="500">Emma L.</text>
    
    <!-- Partial Card (showing scroll) -->
    <rect x="545" y="0" width="160" height="100" rx="10" fill="white" opacity="0.5"/>
  </g>
  
  <!-- Second Row (reverse) -->
  <g transform="translate(0, 193)">
    <rect x="-30" y="0" width="160" height="100" rx="10" fill="white" opacity="0.5"/>
    
    <rect x="105" y="0" width="160" height="100" rx="10" fill="white" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="120" y="25" font-family="system-ui" font-size="10" fill="#ec4899">★★★★★</text>
    <text x="120" y="45" font-family="system-ui" font-size="9" fill="#666">"Best ever!"</text>
    <text x="120" y="75" font-family="system-ui" font-size="10" fill="#1a1a1a" font-weight="500">Tom B.</text>
    
    <rect x="280" y="0" width="160" height="100" rx="10" fill="white" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="295" y="25" font-family="system-ui" font-size="10" fill="#ec4899">★★★★★</text>
    <text x="295" y="45" font-family="system-ui" font-size="9" fill="#666">"So good!"</text>
    <text x="295" y="75" font-family="system-ui" font-size="10" fill="#1a1a1a" font-weight="500">Lisa K.</text>
    
    <rect x="455" y="0" width="160" height="100" rx="10" fill="white" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.05))"/>
    <text x="470" y="25" font-family="system-ui" font-size="10" fill="#ec4899">★★★★★</text>
    <text x="470" y="45" font-family="system-ui" font-size="9" fill="#666">"Incredible!"</text>
    <text x="470" y="75" font-family="system-ui" font-size="10" fill="#1a1a1a" font-weight="500">John D.</text>
  </g>
  
  <!-- Scroll indicator arrows -->
  <text x="15" y="163" font-family="system-ui" font-size="16" fill="#f9a8d4">←</text>
  <text x="575" y="163" font-family="system-ui" font-size="16" fill="#f9a8d4">→</text>
</svg>